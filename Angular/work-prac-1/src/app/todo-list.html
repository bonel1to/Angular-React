<div class="todo-container">
  <h2>Мой список дел</h2>

  <div class="add-row">
    <input
      #taskInput
      type="text"
      placeholder="Новая задача..."
      (keyup.enter)="addTodo(taskInput)"
    />
    <button type="button" (click)="addTodo(taskInput)">Добавить</button>
  </div>

  <div class="filters">
    <button type="button" [class.active]="filter === 'all'" (click)="filter = 'all'">Все</button>
    <button type="button" [class.active]="filter === 'active'" (click)="filter = 'active'">Активные</button>
    <button type="button" [class.active]="filter === 'done'" (click)="filter = 'done'">Выполненные</button>
  </div>

  @for (todo of filteredTodos; track todo.id) {
    <div class="todo-item">
      <label>
        <input type="checkbox" [checked]="todo.done" (change)="toggleTodo(todo.id)" />
        <span [class.done]="todo.done">{{ todo.text }}</span>
      </label>
      <button
        class="favorite-btn"
        type="button"
        [class.filled]="favorites.isFavorite(todo.id)"
        (click)="favorites.toggle(todo.id)"
        [attr.aria-label]="favorites.isFavorite(todo.id) ? 'Убрать из избранного' : 'Добавить в избранное'"
      >⭐</button>
      <button class="delete-btn" type="button" (click)="removeTodo(todo.id)">
        ✕
      </button>
    </div>
  } @empty {
    <p class="empty-msg">Список пуст.</p>
  }
</div>
